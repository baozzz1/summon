session_exited:
  manual_kill: Session closed. Your next message continues this context.
  manual_kill_reset: Session closed and reset. Your next message starts a fresh conversation without previous context.
  panel_clean: Session exited. Your next message continues this context.
  panel_reset: Session archived. Your next message starts fresh; /resume can restore this session.
  idle_retired: Session automatically exited after being idle, releasing its persistent process. Your next message resumes the same context.
  agent_archived: Session exited; send a message to continue
  group_disbanded: '{chat} was dissolved; related sessions ended. You can message me privately anytime.'
  bot_removed: I was removed from {chat}; related sessions ended. You can message me privately anytime.
  shutdown_interrupt: ⏸️ My daemon restarted and interrupted the previous turn; it will resume automatically afterward.
