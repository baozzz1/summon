name: {{alias}}
display: "{{display}}"
status: {{status}}
# 管家(steward):只处理 /fleet 观测命令。**不起 CLI 会话、不碰终端会话层、不消耗模型额度。**
# 所以这份配置里没有 runtime / cognition / model —— 它不思考,也没有自我认知目录要维护。
# 设计见 docs/spec/2026-08-09-feishu-steward-bot-design.md
role: steward

feishu:
  app_id_env: {{id_env}}
  app_secret_env: {{secret_env}}
  scope: thread
  # 谁能查 fleet 状态。**管家必须填**:留空不是"全放行"而是**全部拒绝** ——
  # 空名单对普通 agent 意味着"群里谁都能 @ 它干活"(合理),对管家意味着"谁都能看全 fleet"
  # (不合理),所以同一个默认值在这里被显式收紧成 fail-closed。填 owner 的 open_id 或 union_id。
  allowed_users: []
  # 未配置时继承整机操作名单；显式名单覆盖全局，空列表回退 allowed_users。
  # operators: []
