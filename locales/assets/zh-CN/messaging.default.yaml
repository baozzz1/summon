# 选不出时的兜底表情。
default_reaction: OK
# 收到消息即贴(daemon 直连);任务完成后 daemon 换贴 done_reaction。
working_reaction: OnIt
# 任务完成 daemon 直连补的。
done_reaction: DONE
# 本轮被「⏸ 打断」按钮中止时补的表情(撤掉 working 后贴它)。须在上面 reactions 安全集内。
interrupted_reaction: SILENT

# 每次注入会话的 prompt 模板。占位:
# - {source}: 私聊为「来自 {who} 的飞书消息」,群聊为「在群「{chat}」里 {who} @你」
# - {who}: 发送人
# - {chat}: 群名;私聊为空
# - {text}: 消息正文
prompt_template: "{source}:「{text}」"

# 会话空闲多久发提示卡片(秒);dispatcher 空闲扫描节拍(秒)。
# 三种捕获模式一视同仁:claude 的 tmux 与 codex/cursor 的常驻 RPC 会话进程都是「挂着不说话
# 也一直占着」的东西,卡上的退出/保活对它们语义相同(compact 在无头 CLI 上如实回执不支持)。
idle_ttl_secs: 86400
idle_scan_secs: 300
# 无头轮真静默上限（正整数秒）。全局或agent覆盖，下一轮生效。
headless_stall_secs: 1800

# 跨后台任务续跑的时间上限(秒)。一轮 end_turn 时仍有后台任务(后台 Bash、后台子 agent / workflow)未完成,
# 主路径不收尾、续跑到 task-notification 到达;超过它强制收尾,防止后台任务永不完成时主路径
# 永久挂起。0 = 关(不续跑)。只对 claude/Transcript 生效。
background_continuation_max_secs: 3600

# 会话空闲多久**自动退出**(秒)。null = 关(内置默认),不写这行的机器行为逐字节不变。
#
# 退出语义是「退出续聊」:保留 resume 记录、只释放会话进程(claude 的 tmux / codex、cursor
# 跨轮存活的 RPC 会话),下条消息按 CLI 原生 resume 接回上下文 —— 不是重置,不丢对话。
# 动机是 claude 每个会话常驻 600-900MB,挂一周的群会把内存吃干,而它们的上下文其实躺在
# 盘上、随时接得回来。
#
# 这是**唯一由扫描线程发起的会话终止**,与「回收/空闲扫描从不擅杀 tmux」那条红线是 owner
# 2026-08-12 显式授权的例外。因此判据一条都不能省(见 `should_retire_idle_session`):
# 会话确实还在、resume 开着、盘上有 session id、此刻没有活跃 turn/subagent。
# 任一条证不了 → 跳过,等下一轮扫描再说。宁可多留一个会话,不可拆错一个。
#
# 建议值 86400(1 天)。要开在 config.yaml 的 messaging: 下写 idle_retire_secs: 86400。
idle_retire_secs: null

# **定时任务尾轮**的静默自动退出(秒)。**默认开:3300(55min)** —— owner 2026-08-13 显式授权
# 的默认值(本仓「回收类机制默认关」惯例的一次显式例外)。
#
# 语义:某会话最后一轮入站是定时器触发(不是人/bot 消息),之后 55min 没有任何新消息 →
# **不发**空闲提醒卡,直接走与 idle_retire_secs 相同的「退出续聊」退出(回执文案复用
# session_exited.idle_retired)。定时任务会话安静地走;人类消息一到,该会话回到普通规则
# (idle_ttl 提醒卡 + idle_retire)。
#
# 三种捕获模式同一条通路:默认退出续聊,timer_idle_retire_reset 打开才重置。
# 都要求没有活跃 turn/subagent 且盘上有 session id;结构条件不可证时保持会话不动。
#
# 要关:messaging: 下写 timer_idle_retire_secs: 0(写 null 只会落回内置默认,不算关)。
timer_idle_retire_secs: 3300

# 定时任务会话空闲归档时是否重置(清 resume 记录,下次定时器触发开全新 session)。
# false(默认)= 退出续聊:保留 resume 记录,下次触发接回原上下文。
# true = 归档即重置:定时会话到点静默退出时清掉 resume 记录,下次触发零历史。
# 仅对定时器尾轮生效;人类消息尾轮的空闲归档永远续聊。per-chat 可在 schedules 面板单独开关。
timer_idle_retire_reset: false

# 跟进消息的「打断」前缀:turn 进行中,以它开头的消息打断当前轮——无头(cursor/codex)对
# 子进程组发 SIGINT、claude 发 tmux Esc,打断后带新消息重跑;否则追加排队(由 CLI 原生队列
# 接力)。空字符串 = 永不打断、一律追加。
# Cursor Headless CLI Session 默认接收同一发起人的轮内追加消息。Cursor 的 `-p` 当前没有原生
# mid-turn 输入接口，所以 summon 会立即 SIGINT 当前轮、保留 session id，再用 `--resume` 带
# 原提示/部分输出/新消息续跑。
steer_cli_session: true

# 轮内 steer(**两条路都默认开**)。轮进行中到达的消息不再由 summon 排队,直接交给 CLI 自己的
# 队列在下一个工具边界消费 —— 你连发两条不必干等前一轮跑完,代价是 N 条消息可能被合成一轮回答。
#
# 「哪些内容属于哪条消息」由**过程展示**表达:追加消息被真正消费那一刻,卡片路径切一张新卡、
# 原生 CoT 打一个段边界。消费判据是白名单式的严格判定(入队不算送达),所以这些边界落在真实的
# 消费时刻上。
#
# 两个键各自独立:tmux 那条是往 TUI 里打字由 claude 的队列消费,RPC 那条是发 `turn/steer` 帧
# 由 codex 在当前 turn 追加。机制毫无共同点,出问题要能只关一条。
steer_transcript: true
steer_rpc: true

# 会话镜像(仅 claude/Transcript,**默认开**):持续 tail 转录,把每个完成的 assistant turn 推回
# 飞书——无论这轮由飞书注入触发,还是你 attach 进 tmux 直敲触发。要关:config/agent.yaml 的
# messaging 下设 session_mirror: false(kill-switch)。
session_mirror: true

# Claude 授权请求与 AskUserQuestion(仅 claude,**默认开**):会话 settings 里挂 PermissionRequest hook,
# 把 Claude 要人确认的那一步转成飞书卡片,点「允许 / 拒绝」或答题后由 hook 回给 Claude。关掉后 hook
# 一律不作答,落回终端对话框与抓屏中介。要关:messaging 下设 claude_permission_hook: false。
claude_permission_hook: true

# 邮箱打码重发(**默认开**):飞书内容审核会整条拒发带外部邮箱的消息(git@github.com:org/repo 这类
# 地址也算)。被拒时把回复、过程、镜像、卡片里的邮箱打成只留用户名首字母(probe.user@example.com →
# p***@example.com)再发一次;没被拒的消息原样送达,按钮回调值与表单预填值不动。被拒时按配置文件
# 当前内容判定,改了即生效。要关:config/agent.yaml 的 messaging 下设 mask_email: false(被拒时
# 改发一句说明)。
mask_email: true

# turn 完成「双卡」(**默认开**):每轮跑完把过程卡(流式打字机卡)定格成「✅ 已完成 + 折叠完整回复
# (可点开查阅)」,并另发一张「📋 总结」卡作为完成信号(新消息气泡,用户一眼知道这轮结束了)。
# 要关:config/agent.yaml 的 messaging 下设 completion_summary_card: false(回退单卡,流式卡末态即回复)。
completion_summary_card: true

# live 卡工具轨迹保留的最大步数(**默认 3**)。轨迹回答的是「刚做完什么、正在做什么」,不是完整
# 日志(完整的在 events.jsonl);步数一多卡片就成了一屏流水账。只对「思考内容不可见」那一档
# (claude 自家模型)有渲染效果——别的模型过程由 thinking 正文承担,不走轨迹。
# 想看得更多就调大;0 按 1 处理(一步不留会连「🔧 执行 X 中…」状态行一起抹掉)。
progress_max_steps: 3

# CoT 外显的三个 agent 级默认值；群内 `/cot` 子命令可逐项覆盖。
# 思考正文默认上卡,工具调用默认不上卡(owner 2026-09-17):思考过程给人看,工具流水默认
# 不出现 —— 工具详情关时 CoT 只有思考正文,想看工具调用可在面板里打开。
cot_visible: true
cot_tool_details: false

# 回复卡角标是否显示思考档位(effort,如 `xhigh`)。角标一行里档位是最容易被当噪音的一项,给它
# 一个能关的位置;开关只管渲染,关掉期间档位照常采集,重新打开当轮即有值可显。
badge_effort: true

# 扁平模型回退表:**只**给没有 models_by_cli 桶的 CLI 用(未知 CLI)。各 CLI 模型命名空间
# 互不通用(同一 Opus 5,claude 里叫 claude-opus-5、cursor 里叫 claude-opus-5-high),
# 混在一张扁平表里点了也起不来——所以默认空,候选一律走下面的 models_by_cli 分桶。
models: []

# 按 CLI 分桶的模型候选,**冷启兜底用**。
#
# 面板候选的事实源是各 backend 自报的目录 —— cursor 走 ACP 时随会话下发,走 CLI 时读 `cursor-agent models`,
# codex/traex 走 app-server 的 `model/list`。上游今天加一个模型,开一条新会话就能在面板上点到,
# 这张表不用动。它只在「目录还没抓到」时顶上:daemon 刚起、这台机器还没开过该 CLI 的会话。
# 所以这里挑的是各家族一个稳定代表,不追新、不求穷举。cursor 只认它自己报的目录,这里不给它兜底。
# claude 是例外 —— 它没有列模型的接口,面板候选只有这张表。
#
# 模型 id 必须是**该 CLI 自己认的写法**:
# - claude:`claude --model` 接受的 id(effort 是独立轴,见下面 efforts);
# - cursor:`cursor-agent models` 列出的 id(推理档位烤在 model 名里,无独立 effort 轴);
# - codex:`codex -m` 接受的 id(effort 走 -c model_reasoning_effort,见 efforts)。
# 切换生效方式按 CLI 自适应:claude 往会话内注入 `/model <id>` 就地切(上下文保留),
# cursor/codex 无头每轮自带 --model/-m(下一条消息生效,也不丢上下文)。
# 在 config.yaml / agent.yaml 的 messaging.models_by_cli 覆盖(**per-key 合并**:只写要改的 CLI 桶,
# 没写的桶继承这里的内置默认 —— 升级新增桶时你自动拿到,不必把三个桶都抄一遍)。
# 飞书里 `/model <id>` 只认候选目录里的 id(backend 自报的目录优先,没有时用这里的桶;claude 另认它
# 内置的别名与当前配置的模型),对不上就不改、回几个最接近的候选按钮;目录之外的 id 用本机
# `summon agents model` 设。
models_by_cli:
  claude:
    # `claude --model` 收全名或别名(opus/fable/sonnet=各家族最新)。这里用全名:agent.yaml 里
    # 一眼看得出实际跑的是哪代,别名随版本漂移反而读不出来。
    # claude 没有列模型的接口,所以这张表是它候选的唯一来源,新模型要手工添。
    - claude-opus-5
    - claude-fable-5
    - claude-sonnet-5
  codex:
    # `codex -m` 收的 slug。冷启窗口用,抓到 `model/list` 的目录后就以目录为准。
    - gpt-5.6-sol
    - gpt-5.6-terra
    - gpt-5.6-luna
    - gpt-5.5
  # cursor 不带内置候选:各人账号能用的模型不同。走 CLI 时候选读 `cursor-agent models`,走 ACP
  # 时只认会话下发的目录;目录没拿到时面板就没有模型按钮,onboard 不写 model 行、由 cursor-agent
  # 用自己的默认 —— 内置一份猜的表会把「目录没拿到」掩盖成「点了起不来」。
  # 要固定候选,在 `~/.summon/config.yaml` 的 `messaging.models_by_cli.cursor` 里配。
  # traex(traecli,codex 的 fork)同理不带内置候选:它有哪些模型取决于接入的网关,以它经
  # `model/list` 自报的目录为准。要在抓到目录之前就有候选,在 `~/.summon/config.yaml` 的
  # `messaging.models_by_cli.traex` 里配。

# codex/traex 的会话是否把 summon 的平台工具(preview / react / send_image)注册成
# app-server dynamic tools,让模型在工具列表里直接调用。
#
# **出厂关。** 这三个能力经 CLI 一直可用(PRIMER 里就教了),打开只是换一条更顺手的通道:
# 不用拼 shell、不用带轮凭证,而且模型连 chat_id 都指定不了,目标一律取自当前轮。
# 关着的理由不是它不安全,是「要不要默认开」属于灰度决定 —— 其中两个工具直接往群里发东西,
# 发出去撤不回来,这个默认值该由人来定。
#
# 工具定义只在 `thread/start` 注册(`thread/resume` 依赖 rollout 恢复,不重传实验字段),
# 所以改了它**要新建会话**才生效:`/quit` 接回的是同一条 thread,工具的有无跟着那条 thread 走。
codex_platform_tools: false

# 按 CLI 钉选的**默认**模型 —— onboard/bind 的 `--model` 缺省值。
#
# 候选目录跟着 backend 走,唯独默认模型留给人定:上游换代那天,你的主力不该被悄悄换掉。
# 解析顺序是 钉选 → backend 自报的默认(codex 的 `isDefault`)→ `models_by_cli` 桶首项。
# 出厂不钉任何一个,也就是默认跟随上游;想锁死就写一行,例如:
#   default_model_by_cli:
#     codex: gpt-5.6-sol
# 与 models_by_cli 同样是 per-key 合并:只钉自己在乎的那个 CLI,其余跟随升级。
default_model_by_cli: {}

# 会话控制面板/onboard 上可选的逻辑 effort 档位(规范全集 none<minimal<low<medium<high<xhigh<max
# <ultra 的子集);最终再与各 CLI 合法集求交 —— ultra 只有 codex 收,claude 桶会自动滤掉它,
# 不必也不该在这里按 CLI 分列。只服务 claude/codex(cursor 档位烤在 model 名里)。
efforts:
  - low
  - medium
  - high
  - xhigh
  - max
  - ultra

# slash 准入黑名单(owner 2026-08-14:准入从白名单/采样池**反转**为可配置黑名单)。
# 默认放行 —— 不在这张名单里、也不在采样池里的命令走通用执行器(注入前仍要正向证明输入态,
# 收尾类别按注入后的观测归类,判不出就回「不确定」)。发现 badcase 往这里加一行即可。
#
# 生效集 = default 段 ∪ 该 backend 段(**纯并集**,段之间不做减法):
#   - 想对所有 backend 生效 → 写进 default;
#   - 只想拦某一个 backend(如「claude 拦 /login,其它放行」)→ 只写进那个 backend 段。
# backend 段对各自通路生效：claude/cursor Transcript 是 TUI 注入，codex/traex Rpc 是原生
# app-server 控制映射。两者都在执行前先过同一张黑名单；Rpc 未映射命令不会降级进模型 prompt。
#
# 覆盖是**逐段整体替换**(config.yaml / agent.yaml 的 messaging.slash_blacklist 下):
# 写 `default: []` 就是把下面这些出厂项全部移除,那是 owner 的权利;不写的段继承出厂值。
# 出厂项挑的都是已确认的 badcase,拒绝理由文案在 driver/slash_pool.rs 的 REJECTED_SAMPLES。
slash_blacklist:
  default:
    # 凭据类:会挂起浏览器流程、改变**跨会话**的账号态 —— 那不是这条会话的事。
    - /login
    - /logout
    # 已采样确认的交互形态:Esc 在这一屏是「清空筛选」,退出实测要按三次,受限 Esc 退不掉它。
    - /config
    # 弹编号菜单;菜单可能与工具授权提示同形,Esc 不授权(pane_input::esc_authorized)——
    # 面板会一直堵着会话。切模型另有面板卡片这条受控路径。
    - /model
    # summon 自己处理(改本群或默认的思考档位);同形变体不能落进通用执行器被裸注入。
    - /effort
  claude: []
  codex: []
  cursor: []

# 会话被强制退出时回执给用户的文案(按退出原因分别配)。群仍在 → 发进原群;
# 群已散 / bot 被移除 → p2p 发给群主(.meta 记的 creator 回退事件 operator / 配置 owner)。
# 在 config.yaml / agent.yaml 的 messaging.session_exited 下逐字段覆盖,热重载。
# 群退出文案支持 {chat}:优先渲染群「群名」,无群名时回退稳定短标识。
session_exited:
  # 不带 --reset 的 kill / 外部销毁 tmux(如会话里敲 /quit):resume 记录还在,续上下文。
