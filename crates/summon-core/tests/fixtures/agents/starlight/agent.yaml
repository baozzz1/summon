name: starlight
display: 星光
status: active
model: claude-opus-4-8
feishu:
  app_id_env: FEISHU_STARLIGHT_APP_ID
  app_secret_env: FEISHU_STARLIGHT_APP_SECRET
  scope: thread
  allowed_users: ["example-user"]
runtime:
  working_dir: "~/Desktop/work/example"
  tmux_name: soul-starlight
  cli: claude
cognition:
  task_contracts: ["daily-standup-agent"]
  history_lookback_days: 2
  writeback: propose
  history_dir: work/standups
