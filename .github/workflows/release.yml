name: release

# 每个版本一个 Release,全部在这里完成。推送 tag 触发:
#   v<x.y.z>          发版。tag 必须指向 main 上的提交,且等于 crates/summon/Cargo.toml 的版本(纯 x.y.z)。
#   test-<提交号前缀>  演练,可以是任何分支上的提交。走完整流程,草稿标成 prerelease,永不转为发布。
#
# prepare 建草稿(或沿用同一提交的草稿;已发布的整轮跳过)→ 两个 Linux 包与 macOS 包分别构建,
# macOS job 绑定 environment `release`,经 owner 批准后才拿得到签名证书 → publish 核对三个包、
# 生成并上传 manifest.json、删掉中间文件,发版 tag 转为发布。只有 prepare 与 publish 有写权限,
# 拿签名证书的 macOS job 没有。
#
# Release 在三个包与 manifest.json 齐全之前一直是草稿,对外不可见;已发布的不改写。任何一步失败都停在
# 草稿,在 Actions 里重跑失败的 job 接着做:草稿里已有一对附件的平台沿用它,只传了一半的逐字节比对,
# 内容不同就失败、不覆盖。判定在 scripts/github-release/release_plan.py,动手在 publish.py。

on:
  push:
    tags: ['v*', 'test-*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      # 完整历史:要查 tag 的提交是否在 main 上。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag and create draft release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 附注 tag 也解到提交;重跑时 GITHUB_SHA 不变,tag 被挪走就对不上 HEAD。
          SHA="$(git rev-parse --verify "$GITHUB_SHA^{commit}")"
          [ "$(git rev-parse HEAD)" = "$SHA" ] \
            || { echo "::error::tag $TAG 现在指向 $(git rev-parse HEAD),不是触发时的 $SHA"; exit 1; }
          KIND="$(python3 scripts/github-release/release_info.py check-tag --tag "$TAG" --sha "$SHA")"
          if [ "$KIND" = release ]; then
            git merge-base --is-ancestor "$SHA" origin/main \
              || { echo "::error::发版 tag $TAG 指向的 $SHA 不在 main 上"; exit 1; }
          fi
          echo "tag $TAG($KIND),提交 $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          DECISION="$(python3 scripts/github-release/publish.py prepare --repo "$REPO" --tag "$TAG" \
            --sha "$SHA" --work "$RUNNER_TEMP/publish")"
          if [ "$DECISION" = skip ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # 在 Ubuntu 22.04 上构建,glibc 2.35 + OpenSSL 3 就是最低支持的系统;package.sh 会拒绝
          # 引用了更新 glibc 符号的二进制。
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sidecar/feishu-connector/go.mod
          cache: false
      - name: Package
        run: bash scripts/github-release/package.sh --out "$RUNNER_TEMP/release"
      - name: Smoke test
        run: bash scripts/github-release/smoke.sh "$RUNNER_TEMP/release" "$PLATFORM"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: summon-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/release/summon-${{ matrix.platform }}.tar.gz
            ${{ runner.temp }}/release/summon-${{ matrix.platform }}.build.json
          if-no-files-found: error
          retention-days: 14

  build-macos:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    # 签名证书只在这个 environment 里;owner 批准后 job 才开始。
    environment: release
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PLATFORM: darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sidecar/feishu-connector/go.mod
          cache: false
      # 依赖的构建脚本在导入证书之前跑完;导入之后只运行签名与包里自己的二进制。
      - name: Build
        run: bash scripts/github-release/package.sh --out "$RUNNER_TEMP/release" --build-only
      - name: Import signing certificate
        env:
          SUMMON_MACOS_CERT_P12: ${{ secrets.SUMMON_MACOS_CERT_P12 }}
          SUMMON_MACOS_CERT_PASSWORD: ${{ secrets.SUMMON_MACOS_CERT_PASSWORD }}
        run: bash scripts/github-release/macos-keychain.sh setup --state "$RUNNER_TEMP/keychain"
      - name: Sign and package
        run: bash scripts/github-release/package.sh --out "$RUNNER_TEMP/release" --skip-build
      - name: Remove signing keychain
        if: always()
        run: bash scripts/github-release/macos-keychain.sh cleanup --state "$RUNNER_TEMP/keychain"
      - name: Smoke test
        run: bash scripts/github-release/smoke.sh "$RUNNER_TEMP/release" "$PLATFORM"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: summon-darwin-arm64
          path: |
            ${{ runner.temp }}/release/summon-darwin-arm64.tar.gz
            ${{ runner.temp }}/release/summon-darwin-arm64.build.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, build-linux, build-macos]
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # 只取发布脚本;这个 job 有写权限,不构建。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: summon-*
          path: ${{ runner.temp }}/built
          merge-multiple: true
      - name: Verify, write manifest and publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          python3 scripts/github-release/publish.py finalize --repo "$REPO" --tag "$TAG" --sha "$SHA" \
            --built "$RUNNER_TEMP/built" --work "$RUNNER_TEMP/publish"
