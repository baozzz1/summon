name: release

# 每个版本一个 Release,全部在这里完成。推送 tag 触发,tag 都必须指向 main 上的提交:
#   v<x.y.z>          发版。tag 等于 crates/summon/Cargo.toml 的版本(纯 x.y.z)。
#   test-<提交号前缀>  演练。走完整流程,草稿标成 prerelease,永不转为发布。
#
# prepare 建草稿(或沿用同一提交的草稿;已发布的整轮跳过)→ build-linux 构建两个 Linux 包;
# build-macos 构建未签名的 macOS 二进制并在这里读出构建戳 → sign-macos 绑定 environment `release`,
# owner 批准后才拿得到签名证书,只做导入证书、codesign、打包 → verify-macos 解包跑冒烟检查 →
# publish 核对三个包、生成并上传 manifest.json、删掉中间文件,发版 tag 转为发布。
# 只有 prepare 与 publish 有写权限,拿签名证书的 sign-macos 没有。
#
# 隔离程度:sign-macos 不跑 cargo/go/swift,不执行被签名的二进制,签名与打包脚本取自 main
# 而不是被打 tag 的提交。但 tag 触发的运行用的是被打 tag 那个提交里的这份工作流:改了工作流的
# 提交可以让 sign-macos 做任何事,environment 也只看 tag 名。所以批准部署之前,要确认这次运行的
# 提交在 main 的第一父链上:仓库只允许 squash 合并,链上每个提交都是一次 review 过的 PR 合入后的
# main。见 CLAUDE.md「发版」。
#
# Release 在三个包与 manifest.json 齐全之前一直是草稿,对外不可见;已发布的不改写。任何一步失败都停在
# 草稿,在 Actions 里重跑失败的 job 接着做:草稿里已有一对附件的平台沿用它,只传了一半的逐字节比对,
# 内容不同就失败、不覆盖。判定在 scripts/github-release/release_plan.py,动手在 publish.py。

on:
  push:
    tags: ['v*', 'test-*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      # 完整历史:要查 tag 的提交是否在 main 上。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag and create draft release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 只把附注 tag 解到提交。tag 现在指向哪里由 publish.py 经 API 查。
          SHA="$(git rev-parse --verify "$GITHUB_SHA^{commit}")"
          KIND="$(python3 scripts/github-release/release_info.py check-tag --tag "$TAG" --sha "$SHA")"
          bash scripts/github-release/on-main.sh "$SHA" origin/main \
            || { echo "::error::tag $TAG 指向的 $SHA 不是某次 PR 合入后的 main"; exit 1; }
          echo "tag $TAG($KIND),提交 $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          DECISION="$(python3 scripts/github-release/publish.py prepare --repo "$REPO" --tag "$TAG" \
            --sha "$SHA" --work "$RUNNER_TEMP/publish")"
          if [ "$DECISION" = skip ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # 在 Ubuntu 22.04 上构建,glibc 2.35 + OpenSSL 3 就是最低支持的系统;package.sh 会拒绝
          # 引用了更新 glibc 符号的二进制。
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sidecar/feishu-connector/go.mod
          cache: false
      - name: Package
        run: bash scripts/github-release/package.sh --out "$RUNNER_TEMP/release"
      - name: Smoke test
        run: bash scripts/github-release/smoke.sh "$RUNNER_TEMP/release" "$PLATFORM"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: summon-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/release/summon-${{ matrix.platform }}.tar.gz
            ${{ runner.temp }}/release/summon-${{ matrix.platform }}.build.json
          if-no-files-found: error
          retention-days: 14

  # 构建未签名的二进制。没有 environment、拿不到证书;构建戳在这里读出,签名一方不必执行二进制。
  build-macos:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sidecar/feishu-connector/go.mod
          cache: false
      - name: Build unsigned binaries
        run: bash scripts/github-release/package.sh --out "$RUNNER_TEMP/release" --unsigned
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-darwin-arm64
          path: ${{ runner.temp }}/release/summon-darwin-arm64.unsigned/
          if-no-files-found: error
          retention-days: 14

  # 签名证书只在 environment `release` 里,owner 批准后 job 才开始。这里只运行取自 main 的签名与打包
  # 脚本、security 与 codesign。脚本是 main 当前的、二进制来自被打 tag 的提交:两边的打包格式
  # 不兼容时 pack.py 的核对失败,不签名。codesign.sh 只在给 .app 签名时引用同目录的
  # electron.entitlements.plist,这里签的是三个独立二进制,所以稀疏检出不取它。
  sign-macos:
    needs: [prepare, build-macos]
    if: needs.prepare.outputs.skip == 'false'
    environment: release
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            /scripts/github-release/
            /scripts/codesign.sh
          sparse-checkout-cone-mode: false
      - name: Check commit is on main
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          bash scripts/github-release/on-main.sh "$SHA" HEAD \
            || { echo "::error::$SHA 不是某次 PR 合入后的 main,不签名"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-darwin-arm64
          path: ${{ runner.temp }}/unsigned
      - name: Import signing certificate
        env:
          SUMMON_MACOS_CERT_P12: ${{ secrets.SUMMON_MACOS_CERT_P12 }}
          SUMMON_MACOS_CERT_PASSWORD: ${{ secrets.SUMMON_MACOS_CERT_PASSWORD }}
        run: bash scripts/github-release/macos-keychain.sh setup --state "$RUNNER_TEMP/keychain"
      - name: Sign and package
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          bash scripts/github-release/sign-macos.sh --unsigned "$RUNNER_TEMP/unsigned" --sha "$SHA" \
            --out "$RUNNER_TEMP/release"
      - name: Remove signing keychain
        if: always()
        run: bash scripts/github-release/macos-keychain.sh cleanup --state "$RUNNER_TEMP/keychain"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: summon-darwin-arm64
          path: |
            ${{ runner.temp }}/release/summon-darwin-arm64.tar.gz
            ${{ runner.temp }}/release/summon-darwin-arm64.build.json
          if-no-files-found: error
          retention-days: 14

  # 签好的包解开来跑一遍:能启动、构建戳一致、三个二进制都是同一团队带时间戳的 Developer ID 签名。
  verify-macos:
    needs: [prepare, sign-macos]
    if: needs.prepare.outputs.skip == 'false'
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: summon-darwin-arm64
          path: ${{ runner.temp }}/release
      - name: Smoke test
        run: bash scripts/github-release/smoke.sh "$RUNNER_TEMP/release" darwin-arm64

  publish:
    needs: [prepare, build-linux, verify-macos]
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # 只取发布脚本;这个 job 有写权限,不构建。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: summon-*
          path: ${{ runner.temp }}/built
          merge-multiple: true
      - name: Verify, write manifest and publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          python3 scripts/github-release/publish.py finalize --repo "$REPO" --tag "$TAG" --sha "$SHA" \
            --built "$RUNNER_TEMP/built" --work "$RUNNER_TEMP/publish"
